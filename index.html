  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#005ae9;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:'Pixelify Sans',system-ui,sans-serif}
  #viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#005ae9 0 50%,#2a1530 50% 100%)}
  #stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;overflow:visible;
    image-rendering:pixelated;image-rendering:crisp-edges}
  #stage img,#stage .sp{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .fill{position:absolute;left:0;width:100%}
  #stage img.mir{transform:scaleX(-1)}

  /* idle animations */
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--d,120px))}}
  .cloud{animation:drift var(--t,40s) ease-in-out infinite alternate}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--b,-8px))}}
  .bob{animation:bob var(--t,5s) ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
  #sparkles{animation:twinkle 1.6s ease-in-out infinite}
  @keyframes giftHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}60%{transform:translateY(0) scaleY(.94)}}
  #gift{animation:giftHop 1.4s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(5deg)}}
  #gift.shake{animation:shake .5s steps(6) 2}
  #gift.gone{transition:transform .35s ease-in,opacity .35s;transform:scale(1.35) translateY(-20px);opacity:0}
  @keyframes glowPulse{0%,100%{opacity:.25}50%{opacity:.7}}
  #portalGlow{position:absolute;left:806px;top:640px;width:68px;height:80px;border-radius:40% 40% 0 0;
    background:radial-gradient(circle at 50% 70%,#bff6ff 0%,#41c7ff88 45%,transparent 75%);animation:glowPulse 2.4s ease-in-out infinite;pointer-events:none}
  @keyframes lampGlow{0%,100%{opacity:.35}50%{opacity:.75}}
  #lampGlow{position:absolute;left:1580px;top:585px;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,#c8f7ff 0%,#5fd8ff66 40%,transparent 70%);animation:lampGlow 2s ease-in-out infinite;pointer-events:none}

  /* gift hit area + hint */
  #giftHit{position:absolute;left:180px;top:560px;width:250px;height:270px;cursor:pointer;z-index:60;border-radius:16px}
  #giftHit:focus-visible{outline:4px dashed #ffd84a;outline-offset:4px}
  #hint{position:absolute;left:215px;top:528px;z-index:61;pointer-events:none;
    background:#0b2f74;color:#ffe27a;border:4px solid #f2c14e;padding:8px 16px 10px;font-size:26px;font-weight:700;white-space:nowrap;
    box-shadow:0 4px 0 #061a42, inset 0 0 0 3px #1d4fa8;letter-spacing:.5px;animation:hintBob 1s ease-in-out infinite}
  #hint:after{content:"";position:absolute;left:80px;bottom:-16px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#f2c14e}
  @keyframes hintBob{0%,100%{margin-top:0}50%{margin-top:-8px}}
  #hint.hide{display:none}

  /* character */
  #hero{position:absolute;width:180px;height:240px;left:1330px;top:577px;z-index:50;pointer-events:none}
  #heroSprite{position:absolute;inset:0;background:url(a/ak_walk_sheet.png) 0 0/1440px 240px no-repeat;image-rendering:pixelated}
  @keyframes walkCycle{from{background-position:0 0}to{background-position:-1440px 0}}
  #hero.walking #heroSprite{animation:walkCycle .8s steps(8) infinite}
  #hero .shadow{position:absolute;left:50%;bottom:4px;width:90px;height:16px;transform:translateX(-50%);
    background:rgba(10,30,10,.35);border-radius:50%}
  @keyframes idleBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  #hero:not(.walking) #heroSprite{animation:idleBreath 1.8s ease-in-out infinite}
  #nameTag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#fff8dc;color:#0b2f74;border:3px solid #0b2f74;
    padding:2px 10px 4px;font-size:18px;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 #0b2f74}

  /* burst */
  #flash{position:absolute;left:305px;top:730px;width:10px;height:10px;border-radius:50%;z-index:70;pointer-events:none;
    background:radial-gradient(circle,#fff 0%,#fff6c8 35%,#ffd84a88 60%,transparent 72%);transform:translate(-50%,-50%) scale(0);opacity:0}
  #flash.go{transition:transform .7s cubic-bezier(.2,.9,.3,1),opacity .9s ease-out;transform:translate(-50%,-50%) scale(260);opacity:1}
  #flash.fade{transition:opacity .6s;opacity:0;transform:translate(-50%,-50%) scale(260)}
  .px{position:absolute;width:12px;height:12px;z-index:71;pointer-events:none}

  /* card modal */
  #rotateHint{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:none;
    background:#0b2f74;color:#ffe27a;border:3px solid #f2c14e;padding:8px 14px;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 #061a42;pointer-events:none}
  @media (orientation:portrait) and (max-width:820px){#rotateHint{display:block}}
  @media (pointer:coarse){#hint{font-size:32px}}
  #soundBtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:120;padding:6px 12px 8px;font-size:22px}
  #modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:rgba(4,18,46,.72);opacity:0;pointer-events:none;transition:opacity .4s;padding:16px}
  #modal.open{opacity:1;pointer-events:auto}
  #cardWrap{position:relative;width:min(86vmin,760px);aspect-ratio:1/1;transform:scale(.2) rotate(-8deg);opacity:0;
    transition:transform .7s cubic-bezier(.18,1.4,.4,1),opacity .4s}
  #modal.open #cardWrap{transform:scale(1) rotate(0);opacity:1}
  #cardWrap img{width:100%;height:100%;display:block;border:6px solid #f2c14e;box-shadow:0 0 0 6px #0b2f74,0 20px 60px rgba(0,0,0,.6);background:#fff}
  #closeBtn{position:absolute;top:-18px;right:-18px;width:48px;height:48px;border:4px solid #f2c14e;background:#0b2f74;color:#ffe27a;
    font:700 26px/1 'Pixelify Sans',sans-serif;cursor:pointer;box-shadow:0 4px 0 #061a42}
  .btn{border:4px solid #f2c14e;background:#0b2f74;color:#ffe27a;font:700 22px 'Pixelify Sans',sans-serif;padding:8px 22px 10px;cursor:pointer;
    box-shadow:0 4px 0 #061a42,inset 0 0 0 3px #1d4fa8}

  .plaque{cursor:default;text-align:center;max-width:min(92vw,760px);font-size:clamp(16px,2.4vmin,24px);line-height:1.3}
  #modal .btn{opacity:0;transition:opacity .4s .6s}
  #modal.open .btn{opacity:1}

<script>
/* ===== 8-bit audio engine (Web Audio, no files) ===== */
const SFX=(function(){
  let ctx=null,master,music,sfx,muted=false,started=false,timer=null,nextT=0,stepI=0;
  try{muted=localStorage.getItem('gift2011_muted')==='1'}catch(e){}
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return false;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:1; master.connect(ctx.destination);
    music=ctx.createGain(); music.gain.value=.16; music.connect(master);
    sfx=ctx.createGain(); sfx.gain.value=.5; sfx.connect(master);
    return true;
  }
  let noiseBuf=null;
  function noise(){ if(noiseBuf)return noiseBuf;
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return noiseBuf; }
  function tone(freq,t,dur,{type='square',vol=.3,dest=sfx,slide=0,attack=.005}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.02);
  }
  function hiss(t,dur,{f=1200,q=1,vol=.3,type='bandpass',f2=0}={}){
    const n=ctx.createBufferSource(),bf=ctx.createBiquadFilter(),g=ctx.createGain();
    n.buffer=noise(); bf.type=type; bf.frequency.setValueAtTime(f,t); bf.Q.value=q;
    if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    n.connect(bf); bf.connect(g); g.connect(sfx); n.start(t); n.stop(t+dur+.02);
  }
  /* --- background music: gentle C-major chiptune, 4 bars x 8 eighth-notes --- */
  const BPM=108, E8=60/BPM/2;
  const LEAD=[76,79,84,83,81,79,76,79, 77,81,79,77,76,74,72,0, 76,79,84,86,88,86,84,81, 79,77,76,74,72,0,0,0];
  const BASS=[48,48,53,55,57,53,55,48];       // one per half bar
  const ARP=[[60,64,67],[60,64,67],[65,69,72],[67,71,74],[69,72,76],[65,69,72],[67,71,74],[60,64,67]];
  function schedule(){
    while(nextT<ctx.currentTime+.15){
      const i=stepI%32, half=Math.floor(i/4);
      const n=LEAD[i]; if(n) tone(mtof(n),nextT,E8*.9,{type:'square',vol:.22,dest:music});
      if(i%4===0) tone(mtof(BASS[half]-12),nextT,E8*3.6,{type:'triangle',vol:.55,dest:music});
      const ch=ARP[half]; tone(mtof(ch[i%3]+12),nextT,E8*.45,{type:'triangle',vol:.12,dest:music});
      nextT+=E8; stepI++;
    }
  }
  function startMusic(){ if(!init())return; if(ctx.state==='suspended')ctx.resume();
    if(started)return; started=true; nextT=ctx.currentTime+.08; timer=setInterval(schedule,30); }
  function duck(sec){ if(!ctx)return; const t=ctx.currentTime;
    music.gain.cancelScheduledValues(t); music.gain.setValueAtTime(music.gain.value,t);
    music.gain.linearRampToValueAtTime(.03,t+.15); music.gain.setValueAtTime(.03,t+sec); music.gain.linearRampToValueAtTime(.16,t+sec+1.2); }
  const now=()=>ctx.currentTime;
  return {
    unlock:startMusic,
    toggle(){ startMusic(); muted=!muted; if(ctx)master.gain.setTargetAtTime(muted?0:1,now(),.05);
      try{localStorage.setItem('gift2011_muted',muted?'1':'0')}catch(e){} return muted; },
    isMuted:()=>muted,
    hover(){ if(!ctx)return; const t=now(); tone(1046,t,.06,{vol:.12}); tone(1568,t+.05,.07,{vol:.1}); },
    select(){ if(!ctx)return; const t=now(); tone(988,t,.08,{vol:.25}); tone(1319,t+.08,.25,{vol:.25}); },
    step(){ if(!ctx)return; const t=now(); hiss(t,.06,{f:900+Math.random()*300,q:1.4,vol:.35}); tone(110,t,.06,{type:'sine',vol:.35,slide:.6}); },
    rattle(){ if(!ctx)return; const t=now();
      for(let k=0;k<8;k++){ tone(k%2?523:659,t+k*.12,.07,{vol:.18}); hiss(t+k*.12,.05,{f:3000,q:2,vol:.18}); } },
    open(){ if(!ctx)return; const t=now();
      hiss(t,.6,{type:'highpass',f:400,f2:6000,vol:.35});
      [84,88,91,96,100,103].forEach((m,k)=>tone(mtof(m),t+.05+k*.055,.35,{type:'triangle',vol:.28})); },
    fanfare(){ if(!ctx)return; duck(2.6); const t=now()+.1;
      const seq=[[72,0,.12],[76,.13,.12],[79,.26,.12],[84,.39,.42],[79,.84,.14],[84,.99,1.2]];
      seq.forEach(([m,o,d])=>{ tone(mtof(m),t+o,d,{vol:.26}); tone(mtof(m-12),t+o,d,{type:'triangle',vol:.3}); });
      [76,79].forEach(m=>tone(mtof(m),t+.99,1.2,{type:'square',vol:.12}));
      for(let k=0;k<6;k++) tone(mtof(96+[0,4,7][k%3]),t+1.1+k*.09,.25,{type:'triangle',vol:.1}); },
    close(){ if(!ctx)return; const t=now(); tone(784,t,.07,{vol:.18}); tone(523,t+.07,.12,{vol:.18}); }
  };
})();
</script>
<script>
(function(){
  const W=1672,H=941;
  const stage=document.getElementById('stage');
  // Vùng "an toàn" luôn phải nhìn thấy: băng rôn, hộp quà, nhân vật, mặt đất
  let SAFE={x:140,y:0,w:1410,h:915};
  let START_X=1330;
  function fit(){
    const vw=window.innerWidth, vh=window.innerHeight;
    const portrait=vh>vw;
    SAFE=portrait?{x:212,y:0,w:1250,h:915}:{x:140,y:0,w:1410,h:915};
    const newStart=portrait?1250:1330;
    if(typeof hero!=='undefined' && !busy && x===START_X){START_X=newStart;setX(START_X);} else START_X=newStart;
    const sc=Math.min(vw/SAFE.w, vh/SAFE.h);
    const sw=W*sc, sh=H*sc;
    let tx=vw/2-(SAFE.x+SAFE.w/2)*sc;
    let ty=vh/2-(SAFE.y+SAFE.h/2)*sc;
    if(sw>=vw) tx=Math.min(0,Math.max(vw-sw,tx)); else tx=(vw-sw)/2;
    if(sh>=vh) ty=Math.min(0,Math.max(vh-sh,ty)); else ty=(vh-sh)*(portrait?0.5:0.42);
    stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',()=>setTimeout(fit,250));
  if(window.visualViewport) visualViewport.addEventListener('resize',fit);

  const hero=document.getElementById('hero');
  const gift=document.getElementById('gift');
  const giftHit=document.getElementById('giftHit');
  const hint=document.getElementById('hint');
  const flash=document.getElementById('flash');
  const modal=document.getElementById('modal');
  const sparkles=document.getElementById('sparkles');

  const TARGET_X=372, SPEED=280; // px per second in scene units
  let x=START_X, busy=false;

  function setX(v){x=v;hero.style.left=v+'px';}
  fit();

  function walkTo(target){
    return new Promise(res=>{
      hero.classList.add('walking');
      SFX.step(); const stepTimer=setInterval(()=>SFX.step(),400);
      const dist=Math.abs(target-x), dur=dist/SPEED*1000, from=x;
      let t0=null;
      function step(ts){
        if(t0===null)t0=ts;
        const p=Math.min(1,(ts-t0)/dur);
        setX(from+(target-from)*p);
        if(p<1)requestAnimationFrame(step);
        else{clearInterval(stepTimer);hero.classList.remove('walking');res();}
      }
      requestAnimationFrame(step);
    });
  }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  function confetti(){
    const colors=['#ffd84a','#ff5a7a','#5fd8ff','#ffffff','#7dff8a','#3d7bff'];
    for(let i=0;i<46;i++){
      const p=document.createElement('div');p.className='px';
      p.style.background=colors[i%colors.length];
      p.style.left='305px';p.style.top='720px';
      stage.appendChild(p);
      const ang=Math.random()*Math.PI*2, r=120+Math.random()*260;
      const dx=Math.cos(ang)*r, dy=Math.sin(ang)*r-160;
      p.animate([
        {transform:'translate(0,0) rotate(0)',opacity:1},
        {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.6},
        {transform:`translate(${dx*1.1}px,${dy+220}px) rotate(${Math.random()*720}deg)`,opacity:0}
      ],{duration:1400+Math.random()*600,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>p.remove();
    }
  }

  async function play(){
    SFX.unlock();
    if(busy)return; busy=true;
    SFX.select(); await wait(250);
    hint.classList.add('hide');
    await walkTo(TARGET_X);
    await wait(150);
    gift.classList.add('shake'); SFX.rattle();
    await wait(1000);
    gift.classList.remove('shake');
    gift.style.animation='none';
    flash.classList.add('go'); confetti(); SFX.open();
    gift.classList.add('gone'); sparkles.style.opacity='0';
    await wait(550);
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); SFX.fanfare();
    flash.classList.remove('go'); flash.classList.add('fade');
    setTimeout(()=>flash.classList.remove('fade'),700);
  }

  function reset(){
    if(modal.classList.contains('open'))SFX.close();
    modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
    gift.classList.remove('gone'); gift.style.animation=''; sparkles.style.opacity='';
    setX(START_X); hint.classList.remove('hide'); busy=false;
  }

  giftHit.addEventListener('click',play);
  giftHit.addEventListener('mouseenter',()=>{if(!busy)SFX.hover();});
  document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true});
  document.addEventListener('keydown',()=>SFX.unlock(),{once:true});
  const soundBtn=document.getElementById('soundBtn');
  const paintSound=()=>{soundBtn.textContent=SFX.isMuted()?'🔇':'🔊';};
  paintSound();
  soundBtn.addEventListener('click',e=>{e.stopPropagation();SFX.toggle();paintSound();});
  giftHit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
  document.getElementById('closeBtn').addEventListener('click',reset);
  modal.addEventListener('click',e=>{if(e.target===modal)reset();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))reset();});
})();
</script>
</body>
</html>
